name: Build Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade -r requirements.txt
      - name: Build
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: ./build.ps1 -SkipInstall
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Grace-PHP-Host-Backup
          path: |
            dist/*.exe
            dist/config.example.json
            dist/README.md
      - name: Remove stale release asset
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete-asset "${{ github.ref_name }}" PHP.exe --yes
          if ($LASTEXITCODE -ne 0) {
            Write-Host "No stale PHP.exe asset was found."
          }
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Grace-PHP-Host-Backup.exe
            dist/config.example.json

